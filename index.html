<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gurinder Chhabra</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23000'/%3E%3Crect x='10' y='10' width='80' height='80' fill='none' stroke='%23ff2e63' stroke-width='4'/%3E%3Ctext x='50' y='68' font-family='monospace' font-size='48' font-weight='bold' fill='%23ff2e63' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #000000;
            --white: #ffffff;
            --red: #ff2e63;
            --yellow: #ffeb3b;
            --cyan: #00ffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--black);
            color: var(--white);
            overflow-x: hidden;
            cursor: crosshair;
        }

        /* Scanline effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(255, 255, 255, 0.03) 2px,
                rgba(255, 255, 255, 0.03) 4px
            );
            pointer-events: none;
            z-index: 9999;
        }

        /* Grid background */
        .grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 46, 99, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 46, 99, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Container */
        .container {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* Main content */
        .content {
            max-width: 800px;
            width: 100%;
            position: relative;
        }

        /* Glitch header */
        .header {
            position: relative;
            margin-bottom: 3rem;
        }

        .name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(3.5rem, 12vw, 8rem);
            line-height: 0.9;
            text-transform: uppercase;
            color: var(--red);
            text-shadow: 
                3px 3px 0 var(--cyan),
                -3px -3px 0 var(--yellow);
            animation: glitchText 3s infinite;
            letter-spacing: -0.05em;
        }

        @keyframes glitchText {
            0%, 90%, 100% {
                text-shadow: 
                    3px 3px 0 var(--cyan),
                    -3px -3px 0 var(--yellow);
            }
            92% {
                text-shadow: 
                    -3px 3px 0 var(--cyan),
                    3px -3px 0 var(--yellow);
            }
            94% {
                text-shadow: 
                    3px -3px 0 var(--cyan),
                    -3px 3px 0 var(--yellow);
            }
        }

        /* Status badge */
        .status {
            display: inline-block;
            background: var(--red);
            color: var(--black);
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 2rem;
            border: 3px solid var(--white);
            box-shadow: 5px 5px 0 var(--cyan);
            animation: statusBlink 2s infinite;
        }

        @keyframes statusBlink {
            0%, 49%, 100% { opacity: 1; }
            50%, 99% { opacity: 0.7; }
        }

        /* Terminal box */
        .terminal {
            background: rgba(255, 255, 255, 0.05);
            border: 3px solid var(--white);
            padding: 2rem;
            margin-bottom: 2rem;
            position: relative;
            box-shadow: 8px 8px 0 var(--red);
        }

        .terminal::before {
            content: '> gurinder.exe';
            position: absolute;
            top: -1.5rem;
            left: 1rem;
            background: var(--black);
            padding: 0 0.5rem;
            font-size: 0.75rem;
            color: var(--cyan);
            border: 2px solid var(--white);
        }

        .terminal p {
            line-height: 1.8;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }

        .terminal p:last-child {
            margin-bottom: 0;
        }

        .cursor-blink {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: var(--cyan);
            margin-left: 4px;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Links */
        .links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-item {
            display: block;
            text-decoration: none;
            color: var(--white);
            background: var(--black);
            border: 3px solid var(--white);
            padding: 1.25rem 1.5rem;
            font-size: 1.125rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            position: relative;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .link-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--red);
            transition: left 0.3s ease;
            z-index: -1;
        }

        .link-item:hover::before {
            left: 0;
        }

        .link-item:hover {
            color: var(--black);
            border-color: var(--red);
            transform: translate(-5px, -5px);
            box-shadow: 5px 5px 0 var(--cyan);
        }

        .link-item:active {
            transform: translate(-2px, -2px);
            box-shadow: 2px 2px 0 var(--cyan);
        }

        .link-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .link-arrow {
            font-size: 1.5rem;
            transition: transform 0.3s ease;
        }

        .link-item:hover .link-arrow {
            transform: translateX(5px);
        }

        /* Decorative elements */
        .deco-box {
            position: fixed;
            border: 2px solid var(--red);
            pointer-events: none;
            opacity: 0.3;
        }

        .deco-box-1 {
            top: 10%;
            left: 5%;
            width: 100px;
            height: 100px;
            animation: float1 8s ease-in-out infinite;
        }

        .deco-box-2 {
            bottom: 15%;
            right: 8%;
            width: 150px;
            height: 80px;
            animation: float2 10s ease-in-out infinite;
        }

        .deco-box-3 {
            top: 50%;
            right: 15%;
            width: 60px;
            height: 120px;
            animation: float1 7s ease-in-out infinite reverse;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(20px, -20px) rotate(5deg); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-15px, 15px) rotate(-3deg); }
        }

        /* Footer */
        .footer {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 2px solid var(--white);
            text-align: center;
            font-size: 0.75rem;
            opacity: 0.5;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .name {
                text-shadow: 
                    2px 2px 0 var(--cyan),
                    -2px -2px 0 var(--yellow);
            }

            .terminal {
                padding: 1.5rem;
                box-shadow: 4px 4px 0 var(--red);
            }

            .link-item:hover {
                transform: translate(-3px, -3px);
                box-shadow: 3px 3px 0 var(--cyan);
            }

            .deco-box {
                display: none;
            }

            body {
                cursor: auto;
            }
        }
    </style>
</head>
<body>
    <div class="grid"></div>

    <div class="deco-box deco-box-1"></div>
    <div class="deco-box deco-box-2"></div>
    <div class="deco-box deco-box-3"></div>

    <div class="container">
        <div class="content">
            <div class="header">
                <div class="status">● AVAILABLE</div>
                <h1 class="name">GURINDER<br>CHHABRA</h1>
            </div>

            <div class="terminal">
                <p>> professional // builder // problem solver</p>
                <p>> focus: technology, strategy & execution</p>
                <p>> status: open to meaningful opportunities<span class="cursor-blink"></span></p>
            </div>

            <div class="links">
                <a href="https://www.linkedin.com/in/gurinder/" target="_blank" rel="noopener noreferrer" class="link-item">
                    <span class="link-label">
                        <span>LINKEDIN</span>
                        <span class="link-arrow">→</span>
                    </span>
                </a>
            </div>

            <div class="footer">
                EST. 2026 // BUILT WITH INTENTION
            </div>
        </div>
    </div>

    <script>
        // Glitch effect on hover
        const name = document.querySelector('.name');
        let glitchInterval;

        name.addEventListener('mouseenter', () => {
            let count = 0;
            glitchInterval = setInterval(() => {
                name.style.transform = `translate(${Math.random() * 4 - 2}px, ${Math.random() * 4 - 2}px)`;
                count++;
                if (count > 10) {
                    clearInterval(glitchInterval);
                    name.style.transform = 'translate(0, 0)';
                }
            }, 50);
        });

        // Random grid flicker
        const grid = document.querySelector('.grid');
        setInterval(() => {
            if (Math.random() > 0.95) {
                grid.style.opacity = Math.random() * 0.3 + 0.7;
                setTimeout(() => {
                    grid.style.opacity = 1;
                }, 50);
            }
        }, 100);

        // Cursor trail effect
        const colors = ['#ff2e63', '#00ffff', '#ffeb3b'];
        document.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.9) {
                const trail = document.createElement('div');
                trail.style.position = 'fixed';
                trail.style.left = e.clientX + 'px';
                trail.style.top = e.clientY + 'px';
                trail.style.width = '3px';
                trail.style.height = '3px';
                trail.style.background = colors[Math.floor(Math.random() * colors.length)];
                trail.style.pointerEvents = 'none';
                trail.style.zIndex = '9998';
                document.body.appendChild(trail);
                
                setTimeout(() => {
                    trail.style.transition = 'opacity 0.5s';
                    trail.style.opacity = '0';
                    setTimeout(() => trail.remove(), 500);
                }, 100);
            }
        });
    </script>
</body>
</html>
